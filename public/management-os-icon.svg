<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="8" />

  <!-- Inner Sky Blue Emblem Box -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#skyGrad)" filter="url(#glow)" />

  <!-- Bold OS Text -->
  <text x="256" y="290" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="140" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">OS</text>

  <!-- Subtitle Badge -->
  <rect x="156" y="350" width="200" height="36" rx="18" fill="#0F172A" opacity="0.9" />
  <text x="256" y="373" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="16" fill="#38BDF8" text-anchor="middle" letter-spacing="2">MANAGEMENT</text>
</svg>
